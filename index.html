<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientif Gym Tracker - Personalizado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 font-sans">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-20 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-emerald-400" id="app-title">⚡ Scientific Tracker</h1>
        <p class="text-xs text-slate-400">Totalmente Offline</p>
      </div>
      <div id="rest-timer" class="text-xs font-mono bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1.5 rounded-lg text-center">
        Descanso: <span id="timer-val">00:00</span>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Seleção de Objetivo Dinâmico -->
    <section class="grid grid-cols-2 gap-2 bg-slate-900 border border-slate-800 p-2 rounded-xl">
      <button id="goal-hipertrofia" class="goal-btn py-2 text-sm font-medium rounded-lg text-emerald-400 bg-emerald-500/10 border border-emerald-500/30">
        Hipertrofia
      </button>
      <button id="goal-perda" class="goal-btn py-2 text-sm font-medium rounded-lg text-indigo-400 bg-indigo-500/10 border border-indigo-500/30">
        Perda de Gordura
      </button>
    </section>

    <!-- Estrutura do Dia de Treino Dinâmico -->
    <section class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg space-y-3">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-emerald-400" id="workout-title">Planilhas de Treino</h2>
      
      <!-- Foco do Treino (Dinâmico) -->
      <div class="bg-slate-950 border border-slate-800 p-3 rounded-lg text-xs space-y-2">
        <p id="activity-guide">Meta Diária: [Selecione o Objetivo]</p>
        <p id="cardio-alerta">Foco do Cardio Final: [Selecione o Objetivo]</p>
      </div>
      
      <!-- Exemplo Dinâmico de Treino -->
      <div id="workout-examples-container" class="space-y-2">
        <!-- Inserido dinamicamente -->
      </div>
    </section>

    <!-- Guia Nutricional Dinâmico -->
    <section class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg space-y-3">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-emerald-400" id="nutrition-title">Guia Nutricional Dinâmico</h2>
      
      <!-- Método do Prato -->
      <div class="grid grid-cols-2 gap-3 items-center">
        <img id="nutrition-plate-img" src="" alt="Exemplo do Prato" class="rounded-lg">
        <div id="nutrition-plan-container" class="text-xs text-slate-300 space-y-1">
          <!-- Inserido dinamicamente -->
        </div>
      </div>
    </section>

    <!-- Matriz de Progresso Dinâmico -->
    <section class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg space-y-3">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-emerald-400" id="progress-title">Matriz de Progresso</h2>
      <div id="progress-matrix-container" class="space-y-2 text-xs">
        <!-- Inserido dinamicamente -->
      </div>
    </section>

    <!-- Registro de Séries (Código Antigo Mantido e Estilizado) -->
    <section class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg space-y-3">
      <h2 class="text-sm font-semibold text-emerald-400 uppercase tracking-wider">Registrar Série Científica</h2>
      <form id="log-form" class="space-y-3">
        <!-- ... Campos mantidos ... -->
      </form>
    </section>

    <!-- Gráfico de Evolução e Registro (Códigos Antigos Mantidos) -->
    <!-- ... Seções mantidas ... -->

  </main>

  <script>
    // ... Código antigo de logs, chart e timer mantido ...

    // Dinâmica de Objetivos
    let currentGoal = 'hipertrofia';

    const goalHipertrofiaBtn = document.getElementById('goal-hipertrofia');
    const goalPerdaBtn = document.getElementById('goal-perda');
    
    goalHipertrofiaBtn.addEventListener('click', () => setGoal('hipertrofia'));
    goalPerdaBtn.addEventListener('click', () => setGoal('perda_gordura'));

    function setGoal(goal) {
      currentGoal = goal;
      localStorage.setItem('gym_goal', goal);
      updateAppGoalVisuals(goal);
    }

    function updateAppGoalVisuals(goal) {
      // Elementos de Título e Cor
      const colorScheme = goal === 'hipertrofia' ? 'emerald' : 'indigo';
      const colorSchemeUpper = colorScheme.charAt(0).toUpperCase() + colorScheme.slice(1);
      
      // Update Cores
      document.querySelectorAll('[id^=app-title], [id^=workout-title], [id^=nutrition-title], [id^=progress-title]')
        .forEach(el => {
          el.classList.remove('text-emerald-400', 'text-indigo-400');
          el.classList.add(`text-${colorScheme}-400`);
        });

      // Update Guia de Atividade e Cardio
      const activityText = goal === 'hipertrofia' ? '8.000 Passos/Dia' : '10.000+ Passos/Dia';
      const cardioText = goal === 'hipertrofia' ? 'Zona 2 ou LISS (30 min)' : 'HIIT ou Intervalado (10 min)';
      document.getElementById('activity-guide').textContent = `Meta Diária: ${activityText}`;
      document.getElementById('cardio-alerta').textContent = `Foco do Cardio Final: ${cardioText}`;

      // Update Guia Nutricional
      const plateImg = goal === 'hipertrofia' ? 'https://via.placeholder.com/150/059669/FFFFFF?text=Hipertrofia' : 'https://via.placeholder.com/150/4f46e5/FFFFFF?text=Perda+Gordura';
      document.getElementById('nutrition-plate-img').src = plateImg;

      const nutritionContainer = document.getElementById('nutrition-plan-container');
      if (goal === 'hipertrofia') {
        nutritionContainer.innerHTML = `
          <p>Superávit Calórico Leve (200-300 kcal)</p>
          <p>Proteína: 1.6-2.2g/kg</p>
          <p>Refeição Exemplo: Omelete 3 ovos + Pão integral + Fruta</p>
        `;
      } else {
        nutritionContainer.innerHTML = `
          <p>Déficit Calórico Leve (300-500 kcal)</p>
          <p>Proteína: 1.6-1.8g/kg + Foco em Fibras</p>
          <p>Refeição Exemplo: Patinho moído 150g + Arroz 150g + Salada</p>
        `;
      }

      // Update Matriz de Progresso
      const progressContainer = document.getElementById('progress-matrix-container');
      if (goal === 'hipertrofia') {
        progressContainer.innerHTML = `
          <p>Métrica Principal: Circunferência Muscular (Braço, Coxa)</p>
          <p>Força: Recorde de Cargas (1RM)</p>
          <p>Visual: Ganho de Massa Visible nas fotos</p>
        `;
      } else {
        progressContainer.innerHTML = `
          <p>Métrica Principal: Circunferência da Cintura</p>
          <p>Força: Manter cargas e aumentar repetições</p>
          <p>Visual: Definição Muscular nas fotos</p>
        `;
      }

      // Update Exemplos de Treino (Exemplos Simples para 1 e 2 dias)
      const workoutContainer = document.getElementById('workout-examples-container');
      if (goal === 'hipertrofia') {
        workoutContainer.innerHTML = `
          <div class="bg-slate-950 p-2.5 rounded-lg text-xs space-y-1">
            <p class="font-semibold text-white">Dia 1: Superiores (Foco Peito/Costas)</p>
            <p class="text-slate-400">Ex: Supino Inclinado (4x8-10), Remada Curvada (4x8-10)</p>
          </div>
          <div class="bg-slate-950 p-2.5 rounded-lg text-xs space-y-1">
            <p class="font-semibold text-white">Dia 2: Inferiores (Foco Perna)</p>
            <p class="text-slate-400">Ex: Agachamento Livre (4x8-10), Leg Press (3x10-12)</p>
          </div>
        `;
      } else {
        workoutContainer.innerHTML = `
          <div class="bg-slate-950 p-2.5 rounded-lg text-xs space-y-1">
            <p class="font-semibold text-white">Dia 1: Full Body (Foco Circuito)</p>
            <p class="text-slate-400">Ex: Afundo 12 reps -> Flexão de braço -> Prancha. Sem descanso entre eles.</p>
          </div>
          <div class="bg-slate-950 p-2.5 rounded-lg text-xs space-y-1">
            <p class="font-semibold text-white">Dia 2: Superior (Foco Supersérie)</p>
            <p class="text-slate-400">Ex: Supino Reto com Halteres + Remada Baixa (4x10-12 reps).</p>
          </div>
        `;
      }
    }

    // Carregar objetivo salvo
    document.addEventListener('DOMContentLoaded', () => {
      const savedGoal = localStorage.getItem('gym_goal');
      if (savedGoal) setGoal(savedGoal);
      else setGoal('hipertrofia');
    });

  </script>
</body>
</html>
