<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker - Meu Treino</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">

  <!-- Cabeçalho -->
  <header class="bg-slate-800 p-4 border-b border-slate-700 sticky top-0 z-10 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-emerald-400">💪 GymTracker</h1>
      <div id="timer-display" class="text-sm font-mono bg-slate-900 px-3 py-1 rounded text-amber-400 border border-amber-500/30">
        Descanso: 00:00
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Formulário para Registrar Exercício -->
    <section class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
      <h2 class="text-lg font-semibold mb-3 text-slate-200">Registrar Série</h2>
      <form id="workout-form" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Exercício</label>
          <input type="text" id="exercise" placeholder="Ex: Supino Reto" required
            class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Carga (kg)</label>
            <input type="number" id="weight" step="0.5" placeholder="80" required
              class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Repetições</label>
            <input type="number" id="reps" placeholder="10" required
              class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <button type="submit" 
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg transition-colors">
          Salvar Série & Iniciar Cronômetro (90s)
        </button>
      </form>
    </section>

    <!-- Histórico do Treino de Hoje -->
    <section class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold text-slate-200">Registro de Hoje</h2>
        <button id="clear-btn" class="text-xs text-rose-400 hover:underline">Limpar Hoje</button>
      </div>
      <div id="logs-container" class="space-y-2 text-sm text-slate-300">
        <!-- Itens inseridos via JS -->
      </div>
    </section>

  </main>

  <script>
    let timerInterval = null;

    // Carregar logs salvos no dispositivo
    document.addEventListener('DOMContentLoaded', loadLogs);

    // Evento de Envio do Formulário
    document.getElementById('workout-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const exercise = document.getElementById('exercise').value.trim();
      const weight = document.getElementById('weight').value;
      const reps = document.getElementById('reps').value;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const logItem = { exercise, weight, reps, time };
      saveLog(logItem);
      renderLogs();

      // Limpar campos de números
      document.getElementById('weight').value = '';
      document.getElementById('reps').value = '';

      // Iniciar timer de descanso de 90 segundos
      startTimer(90);
    });

    // Funções de Gerenciamento do LocalStorage (Funciona Offline)
    function getLogs() {
      const logs = localStorage.getItem('gym_tracker_logs');
      return logs ? JSON.parse(logs) : [];
    }

    function saveLog(item) {
      const logs = getLogs();
      logs.unshift(item); // adiciona no início
      localStorage.setItem('gym_tracker_logs', JSON.stringify(logs));
    }

    function loadLogs() {
      renderLogs();
    }

    function renderLogs() {
      const container = document.getElementById('logs-container');
      const logs = getLogs();

      if (logs.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-center py-2">Nenhum exercício registrado hoje.</p>';
        return;
      }

      container.innerHTML = logs.map(log => `
        <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-slate-700/50">
          <div>
            <span class="font-medium text-white">${log.exercise}</span>
            <span class="text-xs text-slate-400 block">${log.time}</span>
          </div>
          <div class="text-right font-mono text-emerald-400">
            ${log.weight} kg <span class="text-slate-500">x</span> ${log.reps}
          </div>
        </div>
      `).join('');
    }

    // Limpar Histórico
    document.getElementById('clear-btn').addEventListener('click', () => {
      if (confirm('Deseja apagar os registros do dia?')) {
        localStorage.removeItem('gym_tracker_logs');
        renderLogs();
      }
    });

    // Cronômetro de Descanso
    function startTimer(seconds) {
      clearInterval(timerInterval);
      let timeLeft = seconds;
      const display = document.getElementById('timer-display');

      timerInterval = setInterval(() => {
        const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const secs = String(timeLeft % 60).padStart(2, '0');
        display.textContent = `Descanso: ${mins}:${secs}`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          display.textContent = 'Descanso Finalizado!';
        }
        timeLeft--;
      }, 1000);
    }
  </script>
</body>
</html>
